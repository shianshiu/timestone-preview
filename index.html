/* ============================================================
   他石智慧產權事務所 — Editorial × Contemporary Brand Identity（單畫面）
   構圖依業主草圖：Header 左名稱地址、右電話 LINE；左 服務標題 → 四題 → CTA；右 1998；圖3 在右側。
   字體系統：主標 昭源宋體 900（個性）／內容 Noto Sans TC（清楚有份量）／數字 Cormorant。
   色彩：暖白底、深墨綠局部使用（1998、問題標題與分隔線）、赭橘少量強調、炭黑文字；LINE 按鈕保留綠色。
   ============================================================ */
:root{
  --paper:#F5F1E9; --ink:#22231F; --ink-2:#3A3B35; --mute:#6E6A5F;
  --green:#203D35;
  --ochre:#C46A42; --ochre-ink:#A8552F;
  --rule:rgba(34,35,31,.14);
  --line:#08843F; --line-hover:#06733A;
  --display:'Chiron Sung HK','Noto Serif TC',serif; --sans:'Noto Sans TC',sans-serif; --latin:'Cormorant Garamond',serif;
  --px:clamp(20px,5vw,96px);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper)}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,p,ol,address{margin:0;padding:0;font-style:normal}
ol{list-style:none}
svg{display:block}

.page{position:relative;isolation:isolate;overflow:hidden;overflow:clip;min-height:100vh;min-height:100dvh;display:grid;grid-template-rows:auto 1fr}
/* 整頁底紋：圖3 左側的樹影與紙紋，放大取左半邊（壓印圓章不入畫），低對比鋪滿 */
.page::before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(rgba(245,241,233,.55),rgba(245,241,233,.62)),url(img/seal-1536.webp) 0% 55%/200% auto no-repeat}

/* ---------- 圖片：Header 下方、右側 ---------- */
.visual{position:absolute;z-index:-1;top:var(--vis-top,104px);bottom:0;left:40%;right:0;margin:0;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.4) 16%,#000 40%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.4) 16%,#000 40%)}
.visual img{width:100%;height:118%;object-fit:cover;object-position:14% 0;display:block}

/* ---------- Header ---------- */
.head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:clamp(16px,2.6vh,24px) var(--px);border-bottom:1px solid var(--ink);background:rgba(245,241,233,.55)}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.name{font-family:var(--display);font-weight:900;font-size:clamp(26px,2.1vw,30px);line-height:1.2;letter-spacing:.1em;white-space:nowrap}
.name-en{font-family:var(--latin);font-weight:600;font-size:11.5px;line-height:1.3;letter-spacing:.28em;color:var(--mute);white-space:nowrap}
.addr{display:block;font-size:12.5px;line-height:1.4;letter-spacing:.06em;color:var(--ink-2);white-space:nowrap}
/* 手機專用元件（電腦版隱藏） */
.menu-btn,.m-menu,.chev,.tel-num{display:none}
.b-ico,.b-txt{display:contents}
.head-actions{display:flex;align-items:center;gap:22px;flex-shrink:0}

/* ---------- 主要內容 ---------- */
.stage{position:relative;align-self:center;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;column-gap:clamp(32px,5vw,96px);padding:clamp(24px,4.6vh,52px) var(--px)}

/* 創立年份 */
.year{align-self:start;margin-top:6px;display:grid;grid-template-columns:auto auto;align-items:end;column-gap:8px;row-gap:6px;text-align:right}

.year::after{content:"";grid-column:1 / -1;justify-self:end;width:64px;height:3px;background:var(--ochre);margin-top:8px}

/* 四個問題：一整塊深墨綠色塊，從左側頁緣延伸 */
/* 四個問題：開放式編輯排版（關鍵字＋完整問題），以字體、細線與局部色彩建立層次 */
/* 四個問題：Question Tiles（2×2，同一底色、近直角、無圖示無編號）。每張都是 LINE 連結：有疑問就直接問。 */
.faq{margin-top:clamp(22px,4vh,40px);max-width:820px}
.faq h2{font-family:var(--sans);font-weight:500;font-size:clamp(17px,min(2.4vh,1.35vw),20px);line-height:1.5;letter-spacing:.04em;color:var(--ink-2);margin-bottom:clamp(10px,1.8vh,16px)}

.tile{flex:1;display:flex;align-items:center;min-height:clamp(84px,12vh,112px);padding:clamp(16px,2.4vh,24px) 28px;border-radius:2px;
  background:rgba(232,228,219,.8);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(36,37,33,.06);
  font-size:clamp(19px,min(2.5vh,1.45vw),21px);font-weight:500;line-height:1.45;letter-spacing:.02em;
  transition:transform 220ms var(--ease-out),background-color 200ms ease,box-shadow 220ms ease}
.tile .nb{display:inline-block}  /* 依語意斷行，避免把詞拆開 */
.tile:active{transform:scale(.98);transition-duration:100ms}
.tile:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}

/* 聯絡 */
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:clamp(20px,3.6vh,34px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:58px;padding:0 30px;border-radius:8px;
  font-size:19px;font-weight:700;letter-spacing:.08em;white-space:nowrap;color:#fff;
  box-shadow:0 0 0 rgba(0,0,0,0);
  transition:background-color 200ms ease,box-shadow 200ms ease,transform 120ms var(--ease-out)}
.btn svg{width:22px;height:22px;flex-shrink:0;transition:transform 200ms var(--ease-out)}
/* LINE 標誌內有鏤空字，電腦（1 倍密度）需要較大尺寸；偶數尺寸讓垂直置中落在整數像素 */
.btn-line svg:not(.chev){width:24px;height:24px}
.btn:active{transform:translateY(1px) scale(.98);box-shadow:none;transition-duration:80ms}
.btn:focus-visible,.head-tel:focus-visible{outline:2px solid var(--ochre);outline-offset:3px}
.btn-line{background:var(--line)}
/* 來電＝次要按鈕：墨綠描邊（與 1998、問題標題同一品牌色），跟半透明的問題卡片明確區分 */
.btn-tel{background:#FBFAF6;color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.btn-tel:active{background:#ECE8DF;box-shadow:inset 0 0 0 1.5px var(--green)}  /* 按下時保留外框 */
.btn-sm{height:42px;padding:0 16px;font-size:15.5px;gap:8px;border-radius:6px}
.btn-sm svg{width:18px;height:18px}
.btn-sm.btn-line svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){
  .btn-line:hover{background:var(--line-hover);box-shadow:0 8px 18px -10px rgba(8,132,63,.7)}
  .btn-tel:hover{background:#ECE8DF;box-shadow:inset 0 0 0 1.5px var(--green)}
  .btn:hover svg{transform:scale(1.06)}
  .btn-sm:hover{box-shadow:none}
  .head-tel:hover{color:var(--ochre-ink)}
  .tile:hover{transform:translateY(-2px);background:rgba(223,218,207,.92);box-shadow:inset 0 0 0 1px rgba(36,37,33,.08),0 10px 18px -14px rgba(36,37,33,.4)}
  .tile:hover:active{transform:translateY(-2px) scale(.98)}
}
.qr{display:flex;align-items:center;gap:14px;margin-left:12px;padding-left:24px;border-left:1px solid var(--rule)}
.qr img{width:92px;height:92px;display:block;background:#fff;padding:4px;box-shadow:0 0 0 1px var(--rule)}
.qr p{font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--ink)}

/* ---------- 進場：只有三種（圖片、主標、問題卡片），約 1 秒內完成 ---------- */
@keyframes rise10{from{opacity:0;transform:translateY(10px)}}
@keyframes rise8{from{opacity:0;transform:translateY(8px)}}
@keyframes settle{from{transform:scale(1.025)}}
@keyframes fade{from{opacity:0}}
.js .visual img{animation:settle 1200ms var(--ease-out) both}
.js h1{animation:rise10 500ms var(--ease-out) 60ms both}
.js .faq-list li{animation:rise8 300ms var(--ease-out) both}
.js .faq-list li:nth-child(1){animation-delay:220ms}
.js .faq-list li:nth-child(2){animation-delay:280ms}
.js .faq-list li:nth-child(3){animation-delay:340ms}
.js .faq-list li:nth-child(4){animation-delay:400ms}
@media (prefers-reduced-motion: reduce){
  .js .visual img{animation:none}
  .js h1,.js .faq-list li{animation:fade 200ms ease both}
  .btn,.btn svg,.tile{transition:background-color 200ms ease}
  .btn:active,.btn:hover svg,.tile:hover,.tile:active,.tile:hover:active{transform:none}
}

@media (max-width: 1023px) and (min-width: 720px){
